name: Auto-Update Live Streams 24x7

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-streams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Current Live Streams
        run: node update-streams.js

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live streams [skip ci]" && git push)
